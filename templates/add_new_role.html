{% extends 'dashboard.html' %}

{% block title %}Add New Role{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow-sm border-0">

        <div class="card-body p-4">

            <h3 style="color: #b01f2c;">Add New Role</h3>

            <p class="text-muted">
                Create a new role for your organization.
            </p>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label" style="color: #243d7f;">
                        Role Name
                    </label>

                    <input
                        type="text"
                        name="role_name"
                        class="form-control"
                        placeholder="Enter role name"
                        required>

                </div>

                <div class="d-flex justify-content-end gap-2">

                    <a href="{% url 'roles' %}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary">
                        Create Role
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
