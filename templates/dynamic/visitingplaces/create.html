{% extends "dashboard.html" %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow-sm">

        <div class="card-header">
            <h4 style="color: #b01f2c;">Add Tourist Place</h4>
        </div>

        <div class="card-body">

            <form method="POST"
                  enctype="multipart/form-data">

                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label style="color: #243d7f;">Title</label>

                        <input type="text"
                               name="title"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label style="color: #243d7f;">Location</label>

                        <input type="text"
                               name="location"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label style="color: #243d7f;">Rating</label>

                        <input type="number"
                               step="0.1"
                               name="rating"
                               class="form-control">

                    </div>

                

                    <div class="col-md-12 mb-3">

                        <label style="color: #243d7f;">Description</label>

                        <textarea name="description"
                                  rows="5"
                                  class="form-control"></textarea>

                    </div>

                    <div class="col-md-12 mb-3">

                        <label style="color: #243d7f;">Image</label>

                        <input type="file"
                               name="image"
                               class="form-control">

                    </div>

                    <div class="col-md-12 mb-3">

                        <div class="form-check">

                            <input type="checkbox"
                                   class="form-check-input"
                                   name="is_active"
                                   checked>

                            <label class="form-check-label">
                                Active
                            </label>

                        </div>

                    </div>

                </div>

                <button class="btn btn-success">
                    Save Place
                </button>

                <a href="{% url 'dynamic:place_list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
