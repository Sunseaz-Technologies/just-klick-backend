{% extends "dashboard.html" %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow-sm">

        <div class="card-header">
            <h4>Update Tourist Place</h4>
        </div>

        <div class="card-body">

            <form method="POST"
                  enctype="multipart/form-data">

                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Title</label>

                        <input type="text"
                               name="title"
                               value="{{ item.title }}"
                               class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Location</label>

                        <input type="text"
                               name="location"
                               value="{{ item.location }}"
                               class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Rating</label>

                        <input type="number"
                               step="0.1"
                               name="rating"
                               value="{{ item.rating }}"
                               class="form-control">

                    </div>

                

                    <div class="col-md-12 mb-3">

                        <label>Description</label>

                        <textarea name="description"
                                  rows="5"
                                  class="form-control">{{ item.description }}</textarea>

                    </div>

                    <div class="col-md-12 mb-3">

                        {% if item.image %}

                        <img src="{{ item.image.url }}"
                             width="150"
                             class="mb-3 rounded">

                        {% endif %}

                        <input type="file"
                               name="image"
                               class="form-control">

                    </div>

                    <div class="col-md-12 mb-3">

                        <div class="form-check">

                            <input type="checkbox"
                                   name="is_active"
                                   class="form-check-input"
                                   {% if item.is_active %}checked{% endif %}>

                            <label class="form-check-label">
                                Active
                            </label>

                        </div>

                    </div>

                </div>

                <button class="btn btn-primary">
                    Update Place
                </button>

                <a href="{% url 'dynamic:place_list' %}"
                   class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
