{% extends "dashboard.html" %}

{% block content %}

<div class="container-fluid">

<div class="card shadow-sm">

<div class="card-header">
    <h4>Update Team Member</h4>
</div>

<div class="card-body">

<form method="POST"
      enctype="multipart/form-data">

{% csrf_token %}

<div class="mb-3">
    <label>Section Name</label>
    <input type="text"
           name="section_name"
           value="{{ team.section_name }}"
           class="form-control">
</div>

<div class="mb-3">
    <label>Title</label>
    <input type="text"
           name="title"
           value="{{ team.title }}"
           class="form-control">
</div>

<div class="mb-3">
    <label>Description</label>
    <textarea name="description"
              class="form-control">{{ team.description }}</textarea>
</div>

{% if team.image %}
<img src="{{ team.image.url }}"
     width="120"
     class="mb-3">
{% endif %}

<div class="mb-3">
    <label>Image</label>
    <input type="file"
           name="image"
           class="form-control">
</div>

<div class="mb-3">
    <label>Name</label>
    <input type="text"
           name="name"
           value="{{ team.name }}"
           class="form-control">
</div>

<div class="mb-3">
    <label>Role</label>
    <input type="text"
           name="role"
           value="{{ team.role }}"
           class="form-control">
</div>
<div class="mb-3">

    <label class="form-label">
        Status
    </label>

    <div class="form-check">

        <input
            class="form-check-input"
            type="checkbox"
            name="is_active"

            {% if team.is_active %}
                checked
            {% endif %}
        >

        <label class="form-check-label">
            Active
        </label>

    </div>

</div>
<div class="mb-3">
    <label>Member Description</label>
    <textarea name="member_description"
              class="form-control">{{ team.member_description }}</textarea>
</div>

<button class="btn btn-success">
    Update
</button>

</form>

</div>

</div>

</div>

{% endblock %}
