{% extends "dashboard.html" %}

{% block content %}

<div class="container-fluid">

<div class="card shadow-sm">

<div class="card-header">
    <h4>Create Team Member</h4>
</div>

<div class="card-body">

<form method="POST"
      enctype="multipart/form-data">

{% csrf_token %}

<div class="mb-3">
    <label>Section Name</label>
    <input type="text"
           name="section_name"
           class="form-control">
</div>

<div class="mb-3">
    <label>Title</label>
    <input type="text"
           name="title"
           class="form-control">
</div>

<div class="mb-3">
    <label>Description</label>
    <textarea name="description"
              class="form-control"></textarea>
</div>

<div class="mb-3">
    <label>Image</label>
    <input type="file"
           name="image"
           class="form-control">
</div>

<div class="mb-3">
    <label>Name</label>
    <input type="text"
           name="name"
           class="form-control">
</div>

<div class="mb-3">
    <label>Role</label>
    <input type="text"
           name="role"
           class="form-control">
</div>

<div class="mb-3">
    <label>Member Description</label>
    <textarea name="member_description"
              class="form-control"></textarea>
</div>

<div class="mb-3">

    <label class="form-label">
        Status
    </label>

    <div class="form-check">

        <input
            class="form-check-input"
            type="checkbox"
            name="is_active"
            checked
        >

        <label class="form-check-label">
            Active
        </label>

    </div>

</div>
<button class="btn btn-primary">
    Save
</button>

</form>

</div>

</div>

</div>

{% endblock %}
