{% extends "dashboard.html" %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-header bg-primary text-white">

        <h4>Create FAQ</h4>

    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label" style="color: #243d7f;">
                    Question
                </label>

                <input
                    type="text"
                    name="question"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label" style="color: #243d7f;">
                    Answer
                </label>

                <textarea
                    name="answer"
                    class="form-control"
                    rows="5"
                    required
                ></textarea>

            </div>

            <div class="form-check mb-3">

                <input
                    type="checkbox"
                    name="is_active"
                    class="form-check-input"
                    checked
                >

                <label class="form-check-label">
                    Active
                </label>

            </div>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save
            </button>
            <a href="{% url 'dynamic:why_list' %}" class="btn btn-secondary">
                    Cancel
                </a>


        </form>

    </div>

</div>

{% endblock %}
