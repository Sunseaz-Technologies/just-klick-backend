{% extends 'dashboard.html' %}

{% block title %}Edit Student{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header">
        <h4>Edit Student</h4>
    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>First Name</label>
                    <input type="text" name="first_name" value="{{ student.first_name }}" class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Last Name</label>
                    <input type="text" name="last_name" value="{{ student.last_name }}" class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Email</label>
                    <input type="email" name="email" value="{{ student.email }}" class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Father Name</label>
                    <input type="text" name="father_name" value="{{ onboarding.father_name }}" class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label>College Code</label>
                    <input type="text" name="college_code" value="{{ onboarding.college_code }}" class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Department</label>
                    <input type="text" name="dept_course" value="{{ onboarding.dept_course }}" class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Academic Year</label>
                    <input type="text" name="academic_year" value="{{ onboarding.academic_year }}" class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Year Of Study</label>
                    <input type="text" name="year_of_study" value="{{ onboarding.year_of_study }}" class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label>CGPA / Percentage</label>
                    <input type="text" name="cgpa_percentage" value="{{ onboarding.cgpa_percentage }}"
                        class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Career Goal</label>
                    <input type="text" name="career_goal" value="{{ onboarding.career_goal }}" class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Plan After Graduation</label>
                    <input type="text" name="plan_after_graduation" value="{{ onboarding.plan_after_graduation }}"
                        class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Interested Abroad</label>
                    <select name="interested_abroad" class="form-select">
                        <option value="Yes" {% if onboarding.interested_abroad == "Yes" %}selected{% endif %}>Yes</option>
                        <option value="No" {% if onboarding.interested_abroad == "No" %}selected{% endif %}>No</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Preferred Country</label>
                    <input type="text" name="preferred_country" value="{{ onboarding.preferred_country }}"
                        class="form-control">
                </div>

            </div>

            <div class="mt-4">

                <button class="btn btn-primary">
                    <i class="bi bi-check-circle"></i>
                    Update Student
                </button>

                <a href="{% url 'student_details' student.id %}" class="btn btn-secondary">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
