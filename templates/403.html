<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | JustKlick Admin</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(226, 232, 240, 0.8);
            text-align: center;
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }
        .shield-icon {
            font-size: 4rem;
            color: #ef4444;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="mb-3">
            <i class="bi bi-shield-slash-fill shield-icon"></i>
        </div>
        <h3 class="fw-bold text-dark mb-2">Access Denied</h3>
        <span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-10 px-3 py-2 mb-3">403 Forbidden</span>
        <p class="text-muted mb-4">You do not have the required permissions to view this page or perform this action. The administrator has restricted access for your current role.</p>
        
        <div class="d-grid gap-2">
            <a href="{% url 'dashboard' %}" class="btn btn-primary py-2 fw-medium">
                <i class="bi bi-house-door me-2"></i> Back to Dashboard
            </a>
        </div>
    </div>
</body>
</html>
