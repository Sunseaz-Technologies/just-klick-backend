<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Enterprise Portal</title>
    <style>
        /* Premium Light SaaS Design System */
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --border-focus: #2563eb;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-primary: #2563eb;
            --accent-hover: #1d4ed8;
            
            /* Toast Colors */
            --toast-bg-success: #10b981;
            --toast-bg-error: #ef4444;
            
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            font-family: var(--font-stack);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 100% Responsive Card Container */
        .card {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg-card);
            padding: 40px 32px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 
                        0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        h2 {
            font-size: 1.625rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        input::placeholder {
            color: #94a3b8;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            background-color: var(--accent-primary);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .form-footer {
            display: flex;
            justify-content: center;
            margin-top: 24px;
        }

        .back-link {
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--accent-primary);
        }

        /* Top-Right Notification Container */
        #toastContainer {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 350px;
            width: 100%;
        }

        .toast {
            padding: 16px;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.875rem;
            font-weight: 500;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toast.success {
            background-color: var(--toast-bg-success);
        }

        .toast.error {
            background-color: var(--toast-bg-error);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100%) translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0) translateY(0);
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateX(50%);
            }
        }
    </style>
</head>
<body>

<div id="toastContainer"></div>

<div class="card">
    <h2>Forgot Password</h2>
    <p class="subtitle">Provide your account email validation string to generate a secure reset reference payload.</p>

    <form id="forgotPasswordForm" method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="email">Account Email</label>
            <input
                id="email"
                type="email"
                name="email"
                placeholder="name@company.com"
                required
            >
        </div>

        <button type="submit" id="submitBtn">
            Send Reset Link
        </button>

        <div class="form-footer">
            <a href="/" class="back-link">← Back to Login</a> 
        </div>
    </form>
</div>

<script>
    // System Notification Engine
    function showNotification(message, type = 'success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerText = message;
        
        container.appendChild(toast);
        
        // Auto-cleanup lifecycle hook
        setTimeout(() => {
            toast.style.animation = 'fadeOut 0.4s ease forwards';
            setTimeout(() => {
                toast.remove();
            }, 400);
        }, 4000);
    }

    document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const form = this;
        const submitBtn = document.getElementById('submitBtn');
        
        submitBtn.disabled = true;
        submitBtn.innerText = 'Processing Request...';

        const formData = new FormData(form);

        fetch("", {
            method: "POST",
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(async response => {
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.message || 'Verification execution fault occurred.');
            }
            return data;
        })
        .then(data => {
            showNotification(data.message, 'success');
            form.reset();
        })
        .catch(error => {
            showNotification(error.message, 'error');
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Send Reset Link';
        });
    });
</script>

</body>
</html>
