<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Enterprise Portal</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151b2c;
            --bg-input: #1e2640;
            --border-color: #2e3a59;
            --border-focus: #3b82f6;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-primary: #2563eb;
            --accent-hover: #1d4ed8;
            --error-color: #ef4444;
            --success-color: #10b981;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            font-family: var(--font-stack);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg-card);
            padding: 40px 32px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 1px rgba(255,255,255,0.1) inset;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        h2 {
            font-size: 1.75rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 32px;
        }

        .alert-box {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
            animation: fadeIn 0.3s ease;
        }

        .alert-box.error {
            display: block;
            background-color: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            color: var(--error-color);
        }

        .alert-box.success {
            display: block;
            background-color: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.2);
            color: var(--success-color);
        }

        .form-group { position: relative; margin-bottom: 20px; }

        label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }

        input::placeholder { color: #52628b; }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            background-color: var(--accent-primary);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        button:hover { background-color: var(--accent-hover); }
        button:active { transform: scale(0.98); }
        button:disabled {
            background-color: var(--border-color);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .form-footer { display: flex; justify-content: flex-end; margin-top: 16px; }

        a {
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover { color: var(--border-focus); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

    
        #toast {
            position: fixed;
            top: 20px;
            right: 20px;
            min-width: 260px;
            max-width: 340px;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transform: translateX(30px);
            pointer-events: none;
            transition: opacity 0.35s ease, transform 0.35s ease;
            z-index: 9999;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        #toast.toast-success {
            background-color: #0d2b22;
            border: 1px solid rgba(16,185,129,0.35);
            color: var(--success-color);
        }

        #toast.toast-error {
            background-color: #2b0d0d;
            border: 1px solid rgba(239,68,68,0.35);
            color: var(--error-color);
        }

        #toast .toast-icon { font-size: 1.1rem; flex-shrink: 0; }
        #toast .toast-msg  { flex: 1; line-height: 1.4; }
    </style>
</head>
<body>


<div id="toast" role="alert" aria-live="assertive">
    <span class="toast-icon" id="toastIcon"></span>
    <span class="toast-msg"  id="toastMsg"></span>
</div>

<div class="card">
    <h2>Admin Login</h2>
    <p class="subtitle">Enter your credentials to access the system dashboard</p>

    <div id="alertBox" class="alert-box"></div>

    <form id="loginForm" method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="email">Email Address</label>
            <input id="email" type="email" name="email"
                   placeholder="admin@enterprise.com" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" name="password"
                   placeholder="••••••••" required>
        </div>

        <button type="submit" id="submitBtn">Sign In to Dashboard</button>

        <div class="form-footer">
            <a href="{% url 'forgot_password' %}">Forgot Password?</a>
        </div>
    </form>
</div>

<script>
  
    let toastTimer = null;

    function showToast(message, type) {        
        const toast     = document.getElementById('toast');
        const toastIcon = document.getElementById('toastIcon');
        const toastMsg  = document.getElementById('toastMsg');

        toast.className = '';                   
        toastIcon.textContent = type === 'success' ? '✓' : '✕';
        toastMsg.textContent  = message;
        toast.classList.add('show', 'toast-' + type);

        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, 4000);                                
    }

  
    document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const form      = this;
        const submitBtn = document.getElementById('submitBtn');
        const alertBox  = document.getElementById('alertBox');

        submitBtn.disabled   = true;
        submitBtn.innerText  = 'Authenticating...';
        alertBox.className   = 'alert-box';
        alertBox.style.display = 'none';

        const formData = new FormData(form);

        fetch("", {
            method : "POST",
            body   : formData,
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
        .then(async response => {
            const data = await response.json();
            if (!response.ok) throw data;        
            return data;
        })
        .then(data => {
        
            showToast('Login successful! Redirecting to dashboard...', 'success');

            setTimeout(() => {
                window.location.href = data.redirect_url;
            }, 1500);                          
        })
        .catch(data => {
       
            let message = 'An unexpected error occurred.';

            if (data && data.error_field) {
                if (data.error_field === 'email') {
                    message = 'Wrong email address. Please check and try again.';
                } else if (data.error_field === 'password') {
                    message = 'Invalid password. Please try again.';
                } else {
                    message = data.message || message;
                }
            } else if (data && data.message) {
                message = data.message;
            }

            showToast(message, 'error');

            submitBtn.disabled  = false;
            submitBtn.innerText = 'Sign In to Dashboard';
        });
    });
</script>

</body>
</html>
